<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"><defs><radialGradient id="g" cx="70%" cy="20%" r="90%"><stop offset="0" stop-color="#1D4573"/><stop offset="1" stop-color="#0B1F38"/></radialGradient></defs><rect width="640" height="360" fill="url(#g)"/><path d="M40,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M80,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M120,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M160,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M200,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M240,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M280,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M320,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M360,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M400,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M440,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M480,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M520,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M560,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M600,0 V360" stroke="#ffffff" stroke-opacity=".04"/><path d="M0,40 H640" stroke="#ffffff" stroke-opacity=".04"/><path d="M0,80 H640" stroke="#ffffff" stroke-opacity=".04"/><path d="M0,120 H640" stroke="#ffffff" stroke-opacity=".04"/><path d="M0,160 H640" stroke="#ffffff" stroke-opacity=".04"/><path d="M0,200 H640" stroke="#ffffff" stroke-opacity=".04"/><path d="M0,240 H640" stroke="#ffffff" stroke-opacity=".04"/><path d="M0,280 H640" stroke="#ffffff" stroke-opacity=".04"/><path d="M0,320 H640" stroke="#ffffff" stroke-opacity=".04"/><g transform="translate(40.0,81.0) scale(0.8750)"><text x="160.0" y="30.0" fill="#58C4DD" font-size="15" text-anchor="middle" font-family="Figtree, Segoe UI, Arial, sans-serif">Into inventory (an asset until sold)</text><text x="480.0" y="30.0" fill="#FC6255" font-size="15" text-anchor="middle" font-family="Figtree, Segoe UI, Arial, sans-serif">Expensed when incurred</text><text x="40.0" y="70.0" fill="#ECECEC" font-size="14" text-anchor="start" font-family="Figtree, Segoe UI, Arial, sans-serif">• purchase price, import duties</text><text x="40.0" y="100.0" fill="#ECECEC" font-size="14" text-anchor="start" font-family="Figtree, Segoe UI, Arial, sans-serif">• freight to get it in</text><text x="40.0" y="130.0" fill="#ECECEC" font-size="14" text-anchor="start" font-family="Figtree, Segoe UI, Arial, sans-serif">• conversion: labour, overheads</text><text x="40.0" y="160.0" fill="#ECECEC" font-size="14" text-anchor="start" font-family="Figtree, Segoe UI, Arial, sans-serif">• storage needed in production</text><text x="360.0" y="70.0" fill="#BDBDBD" font-size="14" text-anchor="start" font-family="Figtree, Segoe UI, Arial, sans-serif">• abnormal waste</text><text x="360.0" y="100.0" fill="#BDBDBD" font-size="14" text-anchor="start" font-family="Figtree, Segoe UI, Arial, sans-serif">• storage of finished goods</text><text x="360.0" y="130.0" fill="#BDBDBD" font-size="14" text-anchor="start" font-family="Figtree, Segoe UI, Arial, sans-serif">• admin overheads</text><text x="360.0" y="160.0" fill="#BDBDBD" font-size="14" text-anchor="start" font-family="Figtree, Segoe UI, Arial, sans-serif">• selling costs</text><text x="320.0" y="215.0" fill="#BDBDBD" font-size="13" text-anchor="middle" font-style="italic" font-family="Figtree, Segoe UI, Arial, sans-serif">test: was the cost needed to get the goods to where and how they are sold?</text></g></svg>