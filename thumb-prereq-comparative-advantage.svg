<text x="320.0" y="60.0" fill="#ECECEC" font-size="15" text-anchor="middle" font-family="CMU Serif, Georgia, serif">Cloth</text><text x="440.0" y="60.0" fill="#ECECEC" font-size="15" text-anchor="middle" font-family="CMU Serif, Georgia, serif">Wine</text><text x="200.0" y="92.0" fill="#ECECEC" font-size="15" text-anchor="middle" font-family="CMU Serif, Georgia, serif">Atlantis</text><text x="320.0" y="92.0" fill="#BDBDBD" font-size="15" text-anchor="middle" font-family="CMU Serif, Georgia, serif">2</text><text x="440.0" y="92.0" fill="#BDBDBD" font-size="15" text-anchor="middle" font-family="CMU Serif, Georgia, serif">4</text><text x="200.0" y="124.0" fill="#ECECEC" font-size="15" text-anchor="middle" font-family="CMU Serif, Georgia, serif">Borealis</text><text x="320.0" y="124.0" fill="#BDBDBD" font-size="15" text-anchor="middle" font-family="CMU Serif, Georgia, serif">6</text><text x="440.0" y="124.0" fill="#BDBDBD" font-size="15" text-anchor="middle" font-family="CMU Serif, Georgia, serif">6</text><text x="320.0" y="175.0" fill="#ECECEC" font-size="14" text-anchor="middle" font-family="CMU Serif, Georgia, serif">Atlantis: 1 wine costs 2 cloth.  Borealis: 1 wine costs 1 cloth.</text><text x="320.0" y="205.0" fill="#FFFF00" font-size="13" text-anchor="middle" font-style="italic" font-family="CMU Serif, Georgia, serif">Atlantis is better at both (absolute advantage) but should make cloth;</text><text x="320.0" y="225.0" fill="#FFFF00" font-size="13" text-anchor="middle" font-style="italic" font-family="CMU Serif, Georgia, serif">Borealis gives up less to make wine (comparative advantage).</text></g></svg>