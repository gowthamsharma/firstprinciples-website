t><text x="165.0" y="70.0" fill="#58C4DD" font-size="17" text-anchor="middle" font-family="Figtree, Segoe UI, Arial, sans-serif">Ricardian</text><text x="165.0" y="100.0" fill="#ECECEC" font-size="14" text-anchor="middle" font-family="Figtree, Segoe UI, Arial, sans-serif">one factor: labour</text><text x="165.0" y="125.0" fill="#BDBDBD" font-size="13" text-anchor="middle" font-style="italic" font-family="Figtree, Segoe UI, Arial, sans-serif">trade comes from different</text><text x="165.0" y="143.0" fill="#BDBDBD" font-size="13" text-anchor="middle" font-style="italic" font-family="Figtree, Segoe UI, Arial, sans-serif">technology / productivity</text><rect x="340.0" y="40.0" width="270" height="130" rx="3" fill="#5CD0B3" fill-opacity=".22" stroke="#5CD0B3" stroke-width="2.5"/><text x="475.0" y="109.9" fill="#ECECEC" font-size="14" text-anchor="middle" font-family="Figtree, Segoe UI, Arial, sans-serif"></text><text x="475.0" y="70.0" fill="#5CD0B3" font-size="17" text-anchor="middle" font-family="Figtree, Segoe UI, Arial, sans-serif">Heckscher–Ohlin</text><text x="475.0" y="100.0" fill="#ECECEC" font-size="14" text-anchor="middle" font-family="Figtree, Segoe UI, Arial, sans-serif">two factors: capital, labour</text><text x="475.0" y="125.0" fill="#BDBDBD" font-size="13" text-anchor="middle" font-style="italic" font-family="Figtree, Segoe UI, Arial, sans-serif">trade comes from different</text><text x="475.0" y="143.0" fill="#BDBDBD" font-size="13" text-anchor="middle" font-style="italic" font-family="Figtree, Segoe UI, Arial, sans-serif">factor endowments</text><text x="320.0" y="205.0" fill="#FFFF00" font-size="13" text-anchor="middle" font-style="italic" font-family="Figtree, Segoe UI, Arial, sans-serif">H–O adds who wins and loses: the abundant factor gains, the scarce factor loses</text></g></svg>