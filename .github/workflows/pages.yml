name: Publish the site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the CMU Serif fonts (computer-modern 0.1.3, SIL OFL)
        run: |
          base=https://cdn.jsdelivr.net/npm/computer-modern@0.1.3
          curl -fsSL -o cmu-serif-500-roman.woff2  $base/fonts/cmu-serif-500-roman.woff2
          curl -fsSL -o cmu-serif-500-italic.woff2 $base/fonts/cmu-serif-500-italic.woff2
          curl -fsSL -o OFL.txt $base/OFL.txt
          mkdir -p _site && rsync -a --exclude '.git*' --exclude '_site' --exclude '*.py' --exclude 'content' --exclude 'README.md' ./ _site/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
